name: DianStar acceptance
on:
  push:
    branches: ["codex/live-*"]
  pull_request:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Acceptance marker
        run: echo DIANSTAR_ACCEPTANCE_MARKER
      - name: Intentional failure fixture
        if: startsWith(github.head_ref || github.ref_name, 'codex/live-fail-')
        run: |
          echo DIANSTAR_INTENTIONAL_FAILURE
          exit 1
